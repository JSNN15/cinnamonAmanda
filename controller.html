<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mando Kawaii Inteligente • Cinnamoroll Land</title>
  <meta name="theme-color" content="#ffccd5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0; padding: 0;
    }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffeef8 0%, #e0f2fe 50%, #fef3c7 100%);
      font-family: 'Baloo 2', cursive, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    .controller-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 10px 14px env(safe-area-inset-bottom, 10px);
    }

    /* Barra Superior */
    .controller-header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 6px 14px;
      border: 3px solid #ffccd5;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.35);
      gap: 8px;
    }
    .brand-title {
      font-weight: 800; font-size: 15px; color: #5c3d2e;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .header-actions {
      display: flex; align-items: center; gap: 8px;
    }
    .btn-nav-home {
      background: #fdf2f8; border: 2px solid #f472b6; border-radius: 999px;
      padding: 3px 12px; font: 800 13px 'Baloo 2', cursive; color: #be185d;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      box-shadow: 0 2px 0 #db2777; transition: transform 0.1s;
    }
    .btn-nav-home:active {
      transform: translateY(2px); box-shadow: 0 0 0 #db2777;
    }
    .status-badge {
      font-size: 12px; font-weight: 800;
      padding: 3px 10px; border-radius: 999px;
      display: flex; align-items: center; gap: 4px;
      transition: all 0.3s ease; white-space: nowrap;
    }
    .status-badge.connecting {
      background: #fef3c7; color: #b45309; border: 2px solid #fde68a;
    }
    .status-badge.connected {
      background: #dcfce7; color: #15803d; border: 2px solid #86efac;
    }
    .status-badge.disconnected {
      background: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5;
    }

    /* Área Dinámica de Controles */
    .gamepad-dynamic-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6px 0;
      position: relative;
      overflow: hidden;
    }

    /* MODO 1: ACCIÓN / PLATAFORMAS (Palanca + Botones) */
    .layout-action {
      width: 100%; height: 100%;
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px;
    }

    /* PALANCA TÁCTIL ANALÓGICA VIRTUAL (Joystick) */
    .joystick-zone {
      width: 160px; height: 160px;
      position: relative;
      display: flex; justify-content: center; align-items: center;
      touch-action: none;
    }
    .joystick-base {
      width: 150px; height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0f2fe 70%, #bae6fd 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 8px 24px rgba(142, 202, 230, 0.45), inset 0 2px 6px rgba(0,0,0,0.06);
      position: relative;
      display: flex; justify-content: center; align-items: center;
    }
    .joystick-guide-ring {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 2px dashed rgba(56, 189, 248, 0.5);
      position: absolute; pointer-events: none;
    }
    .joystick-arrows-hint {
      position: absolute; inset: 6px;
      pointer-events: none; display: flex;
      justify-content: space-between; align-items: center;
      font-size: 14px; color: #38bdf8; opacity: 0.6;
    }
    .joystick-arrows-hint.vertical {
      flex-direction: column;
    }
    .joystick-knob {
      width: 66px; height: 66px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #93c5fd 0%, #3b82f6 75%, #1d4ed8 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 6px 14px rgba(29, 78, 216, 0.35), inset 0 2px 4px rgba(255,255,255,0.7);
      display: flex; justify-content: center; align-items: center;
      font-size: 26px; color: #ffffff;
      position: absolute;
      transform: translate(0px, 0px);
      transition: box-shadow 0.1s;
      pointer-events: none;
      will-change: transform;
    }
    .joystick-knob.active {
      box-shadow: 0 2px 6px rgba(29, 78, 216, 0.5), inset 0 1px 3px rgba(255,255,255,0.9);
      background: radial-gradient(circle at 35% 35%, #60a5fa 0%, #2563eb 80%, #1e40af 100%);
    }

    /* BOTONES DE ACCIÓN DERECHOS */
    .action-buttons-cluster {
      display: flex; flex-direction: column;
      gap: 10px; align-items: flex-end;
    }
    .btn-action-hero {
      width: 145px; height: 66px;
      border-radius: 33px; border: 3.5px solid #ffffff;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 18px; font-weight: 800; color: #ffffff;
      cursor: pointer; touch-action: none;
      transition: transform 0.06s;
    }
    .btn-action-hero:active, .btn-action-hero.pressed {
      transform: scale(0.93) translateY(3px);
    }
    .btn-jump-action {
      background: linear-gradient(135deg, #ff70a6 0%, #ff9770 100%);
      box-shadow: 0 5px 0 #db3e7c, 0 8px 16px rgba(255, 112, 166, 0.35);
    }
    .btn-jump-action:active, .btn-jump-action.pressed {
      box-shadow: 0 1px 0 #db3e7c;
    }
    .btn-treat-action {
      background: linear-gradient(135deg, #ffd166 0%, #f77f00 100%);
      box-shadow: 0 5px 0 #d96800, 0 8px 16px rgba(255, 170, 0, 0.35);
      width: 135px; height: 58px;
    }
    .btn-treat-action:active, .btn-treat-action.pressed {
      box-shadow: 0 1px 0 #d96800;
    }
    .btn-switch-hero-action {
      background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
      box-shadow: 0 4px 0 #6d28d9, 0 6px 12px rgba(124, 58, 237, 0.3);
      width: 135px; height: 48px; font-size: 15px;
    }
    .btn-switch-hero-action:active, .btn-switch-hero-action.pressed {
      box-shadow: 0 1px 0 #6d28d9;
    }

    /* MODO 2: MATEMÁTICAS EN LA TELE (Keypad Gigante) */
    .layout-math {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: space-around; align-items: center;
      gap: 8px;
    }
    .math-companion-header {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #ffb6d2; border-radius: 20px;
      padding: 6px 18px; text-align: center;
      box-shadow: 0 4px 12px rgba(232, 103, 159, 0.2);
      width: 100%; max-width: 380px;
    }
    .math-companion-q {
      font-size: 18px; font-weight: 800; color: #5d4037;
    }
    .math-companion-hint {
      font-size: 12px; font-weight: 700; color: #db2777;
    }
    .math-companion-grid {
      display: flex; gap: 14px; justify-content: center;
      width: 100%; max-width: 420px;
    }
    .btn-math-remote {
      flex: 1; max-width: 110px; height: 96px;
      background: #ffffff; border: 4px solid #b3e5fc; border-radius: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; touch-action: none;
      box-shadow: 0 6px 0 #81d4fa, 0 8px 16px rgba(129, 212, 250, 0.3);
      transition: transform 0.08s, background-color 0.15s, border-color 0.15s;
    }
    .btn-math-remote:active, .btn-math-remote.pressed {
      transform: scale(0.93) translateY(4px);
      box-shadow: 0 1px 0 #81d4fa;
      background: #e0f2fe;
    }
    .math-remote-num {
      font-size: 40px; font-weight: 800; color: #0288d1; line-height: 1;
    }
    .math-remote-icon {
      font-size: 16px; margin-top: 2px;
    }

    /* MODO 3: SELECTOR DE JUEGOS (HUB) */
    .layout-hub {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 10px;
    }
    .hub-companion-title {
      font-size: 16px; font-weight: 800; color: #47689e; text-align: center;
    }
    .hub-companion-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; width: 100%; max-width: 440px;
    }
    .btn-hub-remote {
      background: #ffffff; border: 2.5px solid #cbd5e1; border-radius: 16px;
      padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; cursor: pointer; box-shadow: 0 3px 0 #94a3b8;
      transition: transform 0.08s;
    }
    .btn-hub-remote:active {
      transform: translateY(2px); box-shadow: 0 1px 0 #94a3b8;
    }
    .btn-hub-remote .hub-ico { font-size: 24px; }
    .btn-hub-remote .hub-lbl { font-size: 11px; font-weight: 800; color: #334155; }

    /* Footer */
    .controller-footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 700; color: #7a523a;
      opacity: 0.9; padding: 0 4px;
    }
    .footer-game-label {
      background: rgba(255, 255, 255, 0.7); border-radius: 999px;
      padding: 2px 10px; font-weight: 800; color: #0284c7;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="controller-container">
    <!-- Header Universal -->
    <header class="controller-header">
      <div class="brand-title">🌸 Mando Amanda</div>
      <div class="header-actions">
        <button id="btnRemoteHome" class="btn-nav-home" aria-label="Ir al Menú">🏠 Menú</button>
        <div id="connStatus" class="status-badge connecting">🟡 Conectando...</div>
      </div>
    </header>

    <!-- Escenario Dinámico Según el Juego Activo en TV/PC -->
    <main class="gamepad-dynamic-stage" id="gamepadStage">
      <!-- 1. MODO ACCIÓN / RUN / FLIGHT / DOOM (Con Palanca Analógica Diagonales) -->
      <div id="layoutAction" class="layout-action">
        <!-- Palanca Táctil Analógica Virtual 360° -->
        <div class="joystick-zone" id="joystickZone">
          <div class="joystick-base" id="joystickBase">
            <div class="joystick-guide-ring"></div>
            <div class="joystick-arrows-hint"><span>◀</span><span>▶</span></div>
            <div class="joystick-arrows-hint vertical"><span>▲</span><span>▼</span></div>
            <div class="joystick-knob" id="joystickKnob">🌸</div>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="action-buttons-cluster">
          <button class="btn-action-hero btn-jump-action" id="btnJumpAction" data-btn="jump" aria-label="Saltar">
            <span>🌸</span> <span id="labelJump">¡SALTAR!</span>
          </button>
          <button class="btn-action-hero btn-treat-action" id="btnTreatAction" data-btn="treat" aria-label="Lanzar Dulce">
            <span>🧁</span> <span id="labelTreat">DULCE</span>
          </button>
          <button class="btn-action-hero btn-switch-hero-action" id="btnSwitchHeroAction" aria-label="Cambiar Amigo">
            <span>🔄</span> <span>AMIGO</span>
          </button>
        </div>
      </div>

      <!-- 2. MODO PASTELERÍA DE NÚMEROS (Keypad Inteligente) -->
      <div id="layoutMath" class="layout-math hidden">
        <div class="math-companion-header">
          <div class="math-companion-q" id="mathRemoteQuestion">¿Cuánto es...? 🧁</div>
          <div class="math-companion-hint">👆 Toca el número correcto en tu celular:</div>
        </div>
        <div class="math-companion-grid" id="mathRemoteGrid">
          <!-- Botones de opciones generados dinámicamente -->
        </div>
      </div>

      <!-- 3. MODO HUB (Selector de Juegos a Distancia) -->
      <div id="layoutHub" class="layout-hub hidden">
        <div class="hub-companion-title">✨ Elige un juego para jugar en la pantalla: ✨</div>
        <div class="hub-companion-grid">
          <button class="btn-hub-remote" data-screen="flight"><span class="hub-ico">🛫</span><span class="hub-lbl">Volar</span></button>
          <button class="btn-hub-remote" data-screen="math"><span class="hub-ico">🧁</span><span class="hub-lbl">Sumas</span></button>
          <button class="btn-hub-remote" data-screen="coloring"><span class="hub-ico">🎨</span><span class="hub-lbl">Dibujo</span></button>
          <button class="btn-hub-remote" data-screen="memory"><span class="hub-ico">🃏</span><span class="hub-lbl">Memoria</span></button>
          <button class="btn-hub-remote" data-screen="platformer"><span class="hub-ico">🏃</span><span class="hub-lbl">Super Run</span></button>
          <button class="btn-hub-remote" data-screen="doom"><span class="hub-ico">🎮</span><span class="hub-lbl">Repartidor 3D</span></button>
          <button class="btn-hub-remote" data-screen="writing"><span class="hub-ico">✏️</span><span class="hub-lbl">Palabras</span></button>
          <button class="btn-hub-remote" data-screen="puzzle"><span class="hub-ico">🧩</span><span class="hub-lbl">Puzzles</span></button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="controller-footer">
      <span>✨ Conectado a Cinnamoroll Land</span>
      <span class="footer-game-label" id="footerGameLabel">🏃 Super Run</span>
    </footer>
  </div>

  <script src="js/peerjs.min.js"></script>
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const roomCode = (urlParams.get('room') || 'AMND').toUpperCase();
      const statusEl = document.getElementById('connStatus');
      const footerLabel = document.getElementById('footerGameLabel');

      let peerConn = null;
      let broadcastChannel = null;
      let audioCtx = null;
      let currentScreenMode = 'platformer';

      // Feedback háptico y sonoro
      function playHapticBeep(freq = 580) {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(25); } catch (_) {}
        }
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch (_) {}
      }

      function updateStatus(state, msg) {
        statusEl.className = 'status-badge ' + state;
        statusEl.textContent = msg;
      }

      // Enviar datos hacia la PC / TV
      function sendData(payload) {
        if (peerConn && peerConn.open) {
          try { peerConn.send(payload); } catch (_) {}
        }
        if (broadcastChannel) {
          try { broadcastChannel.postMessage(payload); } catch (_) {}
        }
      }

      function sendButton(btn, pressed) {
        if (pressed) playHapticBeep();
        sendData({ type: 'input', btn, pressed });
      }

      // -------------------------------------------------------------
      // GESTOR DE CONEXIÓN (BroadcastChannel + PeerJS WebRTC)
      // -------------------------------------------------------------
      try {
        if ('BroadcastChannel' in window) {
          broadcastChannel = new BroadcastChannel(`cinna_pad_${roomCode}`);
          broadcastChannel.postMessage({ type: 'hello', room: roomCode });
          broadcastChannel.onmessage = (ev) => {
            if (!ev.data) return;
            if (ev.data.type === 'welcome') {
              updateStatus('connected', '🟢 ¡Conectado a PC! ✨');
            } else if (ev.data.type === 'context') {
              handleGameContext(ev.data);
            }
          };
        }
      } catch (_) {}

      function connectPeer() {
        if (typeof Peer === 'undefined') {
          updateStatus('connected', '🟢 Listo (Canal Local)');
          return;
        }

        const peer = new Peer({ debug: 0 });
        const hostId = `cinna-host-${roomCode.toLowerCase()}`;

        peer.on('open', () => {
          updateStatus('connecting', '🟡 Conectando a TV...');
          const conn = peer.connect(hostId, { reliable: true });

          conn.on('open', () => {
            peerConn = conn;
            updateStatus('connected', '🟢 ¡En Vivo en TV! ✨');
            conn.send({ type: 'hello', room: roomCode });
          });

          conn.on('data', (data) => {
            if (data && data.type === 'context') {
              handleGameContext(data);
            }
          });

          conn.on('close', () => {
            peerConn = null;
            updateStatus('disconnected', '🔴 Desconectado');
            setTimeout(connectPeer, 2000);
          });

          conn.on('error', () => {
            updateStatus('disconnected', '🔴 Buscando TV...');
            setTimeout(connectPeer, 2000);
          });
        });

        peer.on('error', () => {
          updateStatus('disconnected', '🔴 Buscando TV...');
          setTimeout(connectPeer, 2500);
        });
      }
      connectPeer();

      // -------------------------------------------------------------
      // ADAPTABILIDAD SEGÚN EL JUEGO ACTIVO (Smart Gamepad Modes)
      // -------------------------------------------------------------
      const layoutAction = document.getElementById('layoutAction');
      const layoutMath = document.getElementById('layoutMath');
      const layoutHub = document.getElementById('layoutHub');
      const labelJump = document.getElementById('labelJump');
      const labelTreat = document.getElementById('labelTreat');
      const mathRemoteQuestion = document.getElementById('mathRemoteQuestion');
      const mathRemoteGrid = document.getElementById('mathRemoteGrid');

      function handleGameContext(ctx) {
        window.currentContext = ctx;
      }
      window.handleGameContext = (ctx) => {
        if (!ctx) return;
        const screen = ctx.screen || 'platformer';
        currentScreenMode = screen;

        layoutAction.classList.add('hidden');
        layoutMath.classList.add('hidden');
        layoutHub.classList.add('hidden');

        if (screen === 'math') {
          layoutMath.classList.remove('hidden');
          footerLabel.textContent = '🧁 Pastelería';
          if (ctx.question) mathRemoteQuestion.textContent = ctx.question;

          const options = ctx.options || [1, 2, 3];
          const emoji = ctx.treatEmoji || '🧁';
          mathRemoteGrid.innerHTML = options.map(val => `
            <button class="btn-math-remote" data-val="${val}">
              <span class="math-remote-num">${val}</span>
              <span class="math-remote-icon">${emoji}</span>
            </button>
          `).join('');

          mathRemoteGrid.querySelectorAll('.btn-math-remote').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              playHapticBeep(720);
              btn.classList.add('pressed');
              const val = parseInt(btn.dataset.val, 10);
              sendData({ type: 'mathAnswer', val });
            });
            btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));
            btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));
          });
        } else if (screen === 'hub') {
          layoutHub.classList.remove('hidden');
          footerLabel.textContent = '🏠 Menú Principal';
        } else {
          layoutAction.classList.remove('hidden');
          if (screen === 'flight') {
            footerLabel.textContent = '🛫 ¡A Volar!';
            labelJump.textContent = 'PIRUETA';
            labelTreat.textContent = 'SALUDO';
          } else if (screen === 'doom') {
            footerLabel.textContent = '🎮 Repartidor 3D';
            labelJump.textContent = 'LANZAR';
            labelTreat.textContent = 'DULCE';
          } else {
            footerLabel.textContent = '🏃 Super Run';
            labelJump.textContent = '¡SALTAR!';
            labelTreat.textContent = 'DULCE';
          }
        }
      };
        if (!ctx) return;
        const screen = ctx.screen || 'platformer';
        currentScreenMode = screen;

        // Ocultar todos los layouts
        layoutAction.classList.add('hidden');
        layoutMath.classList.add('hidden');
        layoutHub.classList.add('hidden');

        if (screen === 'math') {
          layoutMath.classList.remove('hidden');
          footerLabel.textContent = '🧁 Pastelería';
          if (ctx.question) mathRemoteQuestion.textContent = ctx.question;

          // Renderizar botones gigantes de números
          const options = ctx.options || [1, 2, 3];
          const emoji = ctx.treatEmoji || '🧁';
          mathRemoteGrid.innerHTML = options.map(val => `
            <button class="btn-math-remote" data-val="${val}">
              <span class="math-remote-num">${val}</span>
              <span class="math-remote-icon">${emoji}</span>
            </button>
          `).join('');

          mathRemoteGrid.querySelectorAll('.btn-math-remote').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              playHapticBeep(720);
              btn.classList.add('pressed');
              const val = parseInt(btn.dataset.val, 10);
              sendData({ type: 'mathAnswer', val });
            });
            btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));
            btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));
          });
        } else if (screen === 'hub') {
          layoutHub.classList.remove('hidden');
          footerLabel.textContent = '🏠 Menú Principal';
        } else {
          // Layout Action (Super Run, Flight, Doom, etc.)
          layoutAction.classList.remove('hidden');

          if (screen === 'flight') {
            footerLabel.textContent = '🛫 ¡A Volar!';
            labelJump.textContent = 'PIRUETA';
            labelTreat.textContent = 'SALUDO';
          } else if (screen === 'doom') {
            footerLabel.textContent = '🎮 Repartidor 3D';
            labelJump.textContent = 'LANZAR';
            labelTreat.textContent = 'DULCE';
          } else {
            footerLabel.textContent = '🏃 Super Run';
            labelJump.textContent = '¡SALTAR!';
            labelTreat.textContent = 'DULCE';
          }
        }
      }

      // Botón universal de volver al Menú
      document.getElementById('btnRemoteHome').addEventListener('click', () => {
        playHapticBeep(450);
        sendData({ type: 'nav', screen: 'hub' });
      });

      // Botón de cambiar héroe en Super Run
      document.getElementById('btnSwitchHeroAction').addEventListener('click', () => {
        playHapticBeep(650);
        sendData({ type: 'switchHero' });
      });

      // Navegación remota desde el Hub
      document.querySelectorAll('.btn-hub-remote').forEach(btn => {
        btn.addEventListener('click', () => {
          playHapticBeep(520);
          const screen = btn.dataset.screen;
          sendData({ type: 'nav', screen });
        });
      });

      // -------------------------------------------------------------
      // PALANCA TÁCTIL ANALÓGICA VIRTUAL (Joystick con Movimiento Diagonal)
      // -------------------------------------------------------------
      const joystickZone = document.getElementById('joystickZone');
      const joystickKnob = document.getElementById('joystickKnob');
      const maxRadius = 48;
      let isJoyActive = false;
      let activePointerId = null;
      let currentDirFlags = { up: false, down: false, left: false, right: false };

      function updateDirectionFlags(isLeft, isRight, isUp, isDown) {
        if (isLeft !== currentDirFlags.left) {
          currentDirFlags.left = isLeft;
          sendButton('left', isLeft);
        }
        if (isRight !== currentDirFlags.right) {
          currentDirFlags.right = isRight;
          sendButton('right', isRight);
        }
        if (isUp !== currentDirFlags.up) {
          currentDirFlags.up = isUp;
          sendButton('up', isUp);
        }
        if (isDown !== currentDirFlags.down) {
          currentDirFlags.down = isDown;
          sendButton('down', isDown);
        }
      }

      function handleJoystickMove(clientX, clientY) {
        const rect = joystickZone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const dx = clientX - centerX;
        const dy = clientY - centerY;
        const dist = Math.hypot(dx, dy);
        const clampedDist = Math.min(dist, maxRadius);
        const angle = Math.atan2(dy, dx);

        const knobX = Math.cos(angle) * clampedDist;
        const knobY = Math.sin(angle) * clampedDist;
        joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

        const normX = +(knobX / maxRadius).toFixed(2);
        const normY = +(knobY / maxRadius).toFixed(2);
        const normDist = +(clampedDist / maxRadius).toFixed(2);

        // Envío continuo analógico para física fluida
        sendData({
          type: 'joystick',
          x: normX,
          y: normY,
          dist: normDist,
          angle: +(angle * (180 / Math.PI)).toFixed(1)
        });

        // Detección diagonal precisa (ej. arriba y derecha simultáneamente)
        const isLeft = normX < -0.28;
        const isRight = normX > 0.28;
        const isUp = normY < -0.28;
        const isDown = normY > 0.28;
        updateDirectionFlags(isLeft, isRight, isUp, isDown);
      }

      function resetJoystick() {
        isJoyActive = false;
        activePointerId = null;
        joystickKnob.classList.remove('active');
        joystickKnob.style.transform = 'translate(0px, 0px)';
        updateDirectionFlags(false, false, false, false);
        sendData({ type: 'joystick', x: 0, y: 0, dist: 0, angle: 0 });
      }

      joystickZone.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isJoyActive = true;
        activePointerId = e.pointerId;
        joystickKnob.classList.add('active');
        playHapticBeep(520);
        handleJoystickMove(e.clientX, e.clientY);
      });

      window.addEventListener('pointermove', (e) => {
        if (!isJoyActive || e.pointerId !== activePointerId) return;
        e.preventDefault();
        handleJoystickMove(e.clientX, e.clientY);
      });

      window.addEventListener('pointerup', (e) => {
        if (e.pointerId === activePointerId) resetJoystick();
      });
      window.addEventListener('pointercancel', (e) => {
        if (e.pointerId === activePointerId) resetJoystick();
      });

      // Botones de acción derecha (Saltar y Dulce)
      document.querySelectorAll('[data-btn]').forEach(el => {
        const btn = el.dataset.btn;
        const start = (e) => {
          e.preventDefault();
          try { el.setPointerCapture(e.pointerId); } catch (_) {}
          el.classList.add('pressed');
          sendButton(btn, true);
        };
        const end = (e) => {
          e.preventDefault();
          try { el.releasePointerCapture(e.pointerId); } catch (_) {}
          el.classList.remove('pressed');
          sendButton(btn, false);
        };
        el.addEventListener('pointerdown', start);
        el.addEventListener('pointerup', end);
        el.addEventListener('pointercancel', end);
      });
    })();
  </script>
</body>
</html>
