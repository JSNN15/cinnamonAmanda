<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mando Kawaii • Cinnamoroll Land</title>
  <meta name="theme-color" content="#ffccd5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0; padding: 0;
    }
    body, html {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffeef8 0%, #e0f2fe 50%, #fef3c7 100%);
      font-family: 'Baloo 2', cursive, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    .controller-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px env(safe-area-inset-bottom, 12px);
    }
    /* Barra Superior */
    .controller-header {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 6px 16px;
      border: 3px solid #ffccd5;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3);
    }
    .brand-title {
      font-weight: 800; font-size: 16px; color: #5c3d2e;
      display: flex; align-items: center; gap: 6px;
    }
    .status-badge {
      font-size: 13px; font-weight: 800;
      padding: 4px 12px; border-radius: 999px;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.3s ease;
    }
    .status-badge.connecting {
      background: #fef3c7; color: #b45309; border: 2px solid #fde68a;
    }
    .status-badge.connected {
      background: #dcfce7; color: #15803d; border: 2px solid #86efac;
    }
    .status-badge.disconnected {
      background: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5;
    }

    /* Área de Botones */
    .gamepad-body {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
    }

    /* D-PAD (Cruz direccional pastel) */
    .dpad-cluster {
      width: 170px; height: 170px;
      position: relative;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 24px rgba(142, 202, 230, 0.35);
      display: flex; justify-content: center; align-items: center;
    }
    .dpad-btn {
      position: absolute;
      width: 52px; height: 52px;
      border-radius: 18px;
      background: #8ecae6;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 0 #58a4c8, 0 6px 12px rgba(0,0,0,0.1);
      display: flex; justify-content: center; align-items: center;
      font-size: 24px; color: #ffffff;
      touch-action: none;
      transition: transform 0.06s, background-color 0.06s;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      transform: scale(0.92) translateY(3px);
      box-shadow: 0 1px 0 #58a4c8;
      background: #4895be;
    }
    .dpad-btn.up    { top: 6px; left: 59px; }
    .dpad-btn.down  { bottom: 6px; left: 59px; }
    .dpad-btn.left  { top: 59px; left: 6px; }
    .dpad-btn.right { top: 59px; right: 6px; }
    .dpad-center {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }

    /* BOTONES DE ACCIÓN (A, B, Magia) */
    .action-cluster {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-end;
    }
    .btn-action-big {
      width: 150px; height: 72px;
      border-radius: 36px;
      border: 4px solid #ffffff;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; font-size: 20px; font-weight: 800; color: #ffffff;
      touch-action: none;
      transition: transform 0.06s;
      cursor: pointer;
    }
    .btn-action-big:active, .btn-action-big.pressed {
      transform: scale(0.93) translateY(3px);
    }
    .btn-jump {
      background: linear-gradient(135deg, #ff70a6 0%, #ff9770 100%);
      box-shadow: 0 6px 0 #db3e7c, 0 8px 16px rgba(255, 112, 166, 0.4);
    }
    .btn-jump:active, .btn-jump.pressed {
      box-shadow: 0 2px 0 #db3e7c;
    }
    .btn-treat {
      background: linear-gradient(135deg, #ffd166 0%, #f77f00 100%);
      box-shadow: 0 6px 0 #d96800, 0 8px 16px rgba(255, 170, 0, 0.35);
      width: 140px; height: 64px;
    }
    .btn-treat:active, .btn-treat.pressed {
      box-shadow: 0 2px 0 #d96800;
    }

    /* Barra Inferior */
    .controller-footer {
      display: flex; justify-content: center; align-items: center;
      gap: 10px; font-size: 13px; font-weight: 700; color: #7a523a;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="controller-container">
    <!-- Header -->
    <header class="controller-header">
      <div class="brand-title">🌸 Mando Amanda</div>
      <div id="connStatus" class="status-badge connecting">🟡 Conectando...</div>
    </header>

    <!-- Gamepad Body -->
    <main class="gamepad-body">
      <!-- D-Pad Izquierdo -->
      <div class="dpad-cluster">
        <button class="dpad-btn up" data-btn="up" aria-label="Arriba">⬆️</button>
        <button class="dpad-btn down" data-btn="down" aria-label="Abajo">⬇️</button>
        <button class="dpad-btn left" data-btn="left" aria-label="Izquierda">⬅️</button>
        <button class="dpad-btn right" data-btn="right" aria-label="Derecha">➡️</button>
        <div class="dpad-center"></div>
      </div>

      <!-- Botones de Acción Derechos -->
      <div class="action-cluster">
        <button class="btn-action-big btn-jump" data-btn="jump" aria-label="Saltar">
          <span>🌸</span> <span>¡SALTAR!</span>
        </button>
        <button class="btn-action-big btn-treat" data-btn="treat" aria-label="Lanzar Dulce">
          <span>🧁</span> <span>DULCE</span>
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="controller-footer">
      <span>✨ Conectado a Cinnamoroll Land • ¡A jugar!</span>
    </footer>
  </div>

  <script src="js/peerjs.min.js"></script>
  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const roomCode = (urlParams.get('room') || 'AMND').toUpperCase();
      const statusEl = document.getElementById('connStatus');
      
      let peerConn = null;
      let broadcastChannel = null;
      let audioCtx = null;

      function playHapticBeep() {
        if ('vibrate' in navigator) {
          try { navigator.vibrate(25); } catch (_) {}
        }
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch (_) {}
      }

      function updateStatus(state, msg) {
        statusEl.className = 'status-badge ' + state;
        statusEl.textContent = msg;
      }

      // 1. BroadcastChannel fallback
      try {
        if ('BroadcastChannel' in window) {
          broadcastChannel = new BroadcastChannel(`cinna_pad_${roomCode}`);
          broadcastChannel.postMessage({ type: 'hello', room: roomCode });
          broadcastChannel.onmessage = (ev) => {
            if (ev.data && ev.data.type === 'welcome') {
              updateStatus('connected', '🟢 ¡Conectado a PC! ✨');
            }
          };
        }
      } catch (_) {}

      // 2. PeerJS WebRTC conexión directa
      function connectPeer() {
        if (typeof Peer === 'undefined') {
          updateStatus('connected', '🟢 Listo (Canal Local)');
          return;
        }

        const peer = new Peer({ debug: 0 });
        const hostId = `cinna-host-${roomCode.toLowerCase()}`;

        peer.on('open', () => {
          updateStatus('connecting', '🟡 Conectando a PC...');
          const conn = peer.connect(hostId, { reliable: true });

          conn.on('open', () => {
            peerConn = conn;
            updateStatus('connected', '🟢 ¡Conectado a PC! ✨');
          });

          conn.on('close', () => {
            peerConn = null;
            updateStatus('disconnected', '🔴 Desconectado');
            setTimeout(connectPeer, 2000);
          });

          conn.on('error', () => {
            updateStatus('disconnected', '🔴 Buscando PC...');
            setTimeout(connectPeer, 2000);
          });
        });

        peer.on('error', () => {
          updateStatus('disconnected', '🔴 Buscando PC...');
          setTimeout(connectPeer, 2500);
        });
      }
      connectPeer();

      // Enviar comando
      function sendCommand(btn, pressed) {
        if (pressed) playHapticBeep();
        const payload = { btn, pressed, type: 'input' };
        if (peerConn && peerConn.open) {
          try { peerConn.send(payload); } catch (_) {}
        }
        if (broadcastChannel) {
          try { broadcastChannel.postMessage(payload); } catch (_) {}
        }
      }

      // Soporte táctil multitouch sin latencia
      document.querySelectorAll('[data-btn]').forEach(el => {
        const btn = el.dataset.btn;
        const start = (e) => {
          e.preventDefault();
          el.classList.add('pressed');
          sendCommand(btn, true);
        };
        const end = (e) => {
          e.preventDefault();
          el.classList.remove('pressed');
          sendCommand(btn, false);
        };

        el.addEventListener('pointerdown', start);
        el.addEventListener('pointerup', end);
        el.addEventListener('pointercancel', end);
        el.addEventListener('pointerleave', end);
      });
    })();
  </script>
</body>
</html>
